[tool.ruff]
target-version = "py313"
extend-exclude = ["venv", "*/migrations/*"]

[tool.ruff.lint]
# E4/E7/E9: pycodestyle errors worth having; F: pyflakes (real bugs:
# undefined names, unused imports); I: import ordering. Line length is
# deliberately not enforced — readability of tax working comments wins.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = [
    "advice", "authority", "clients", "config", "firms",
    "monitoring", "reports", "ruleengine",
]
