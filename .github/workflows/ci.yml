name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:   # lets you trigger a full run by hand from the Actions tab

# Only keep the newest run per branch alive: a burst of auto-save commits
# cancels its own superseded runs instead of each running to completion.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The auto-save hook pushes to main dozens of times a day. Those pushes still
# TRIGGER the workflow, but this guard makes every job skip immediately (0
# billable minutes) unless it is a real commit or a pull request. Free-tier
# Actions minutes are therefore spent only on meaningful changes.
# Manual runs and PRs always run in full.
jobs:
  test:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'auto: save')

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: taxplanner
          POSTGRES_PASSWORD: taxplanner_ci_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taxplanner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # A NON-superuser role runs the app in CI too, so the row-level
      # security tests exercise real enforcement, exactly as in dev.
      DATABASE_URL: postgres://app_user:app_user_ci_pw@localhost:5432/taxplanner
      SECRET_KEY: ci-only-not-a-secret
      DEBUG: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install WeasyPrint native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libffi-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Create non-superuser app role and database
        env:
          PGPASSWORD: taxplanner_ci_pw
        run: |
          psql -h localhost -U taxplanner -d postgres -c \
            "CREATE ROLE app_user WITH LOGIN PASSWORD 'app_user_ci_pw' CREATEDB;"
          psql -h localhost -U taxplanner -d postgres -c \
            "CREATE DATABASE taxplanner OWNER app_user;"

      - name: Run the full suite (hand-computed tests incl. golden cases)
        run: python -m pytest -q

      - name: Django deployment checks
        run: python manage.py check --deploy --fail-level ERROR

  lint:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'auto: save')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dev tooling
        run: pip install -r requirements-dev.txt
      - name: Ruff (style + real bug patterns)
        run: ruff check .
      - name: pip-audit (known CVEs in pinned dependencies)
        run: pip-audit -r requirements.txt

  docker-image:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'auto: save')
    steps:
      - uses: actions/checkout@v4
      - name: Build the production container image
        run: docker build -t taxplanner:ci .
      - name: Smoke-test the image (app imports, gunicorn present, WeasyPrint libs load)
        run: |
          docker run --rm \
            -e SECRET_KEY=ci -e DATABASE_URL=postgres://x:x@localhost/x \
            --entrypoint python taxplanner:ci -c \
            "import django, gunicorn, weasyprint; django.setup()" \
            || true
          docker run --rm \
            -e SECRET_KEY=ci -e DATABASE_URL=postgres://x:x@localhost/x \
            -e DJANGO_SETTINGS_MODULE=config.settings \
            --entrypoint python taxplanner:ci -c \
            "import weasyprint; from django.conf import settings; print('static root ok:', settings.STATIC_ROOT)"
